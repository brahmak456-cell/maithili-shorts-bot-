name: Daily Maithili Auto Post (FB & YouTube)

on:
  schedule:
    # भारत के समय (IST) के अनुसार रोज सुबह 6:00 बजे और शाम 6:00 बजे चलने के लिए
    - cron: '30 0,12 * * *'
  workflow_dispatch: # इससे आप चाहें तो बटन दबाकर कभी भी मैन्युअली भी चला सकते हैं

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai edge-tts moviepy requests google-auth google-auth-oauthlib google-api-python-client

      - name: Install System Dependencies for MoviePy/FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Facebook Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python main.py

      - name: Run YouTube Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main_youtube.py
